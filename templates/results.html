<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipix — Results</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="top-nav">
        <div class="nav-logo">Recipix</div>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/favourites">Saved</a>
            <a href="/account">Account</a>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </nav>

    <div class="page-content">
        <h1 class="page-title">Recipe Results</h1>
        <p class="page-subtitle" id="results-subtitle"></p>

        <div id="loading" class="loading-msg">Finding recipes...</div>
        <div id="error-message" class="error-msg" style="display:none;"></div>

        <div class="results-grid" id="results-grid"></div>

        <div id="no-results" class="no-results-state" style="display:none;">
            <p class="no-results-text">No recipes found for your ingredients.</p>
            <button class="btn-secondary" onclick="window.location.href='/home'">← Try again</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/home" class="nav-item">
            <div class="nav-icon">⌂</div>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item upload-item">
            <div class="nav-icon">+</div>
            <span>Upload</span>
        </a>
        <a href="/favourites" class="nav-item">
            <div class="nav-icon">♡</div>
            <span>Saved</span>
        </a>
        <a href="/account" class="nav-item">
            <div class="nav-icon">👤</div>
            <span>Account</span>
        </a>
    </nav>

    <script src="/static/js/results.js"></script>
</body>
</html>
