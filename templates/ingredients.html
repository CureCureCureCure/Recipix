<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipix — Ingredients</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="top-nav">
        <div class="nav-logo">Recipix</div>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/favourites">Saved</a>
            <a href="/account">Account</a>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </nav>

    <div class="page-content">
        <h1 class="page-title">Confirm Ingredients</h1>
        <p class="page-subtitle">Remove any incorrect ingredients or add ones that were missed.</p>

        <div id="loading" class="loading-msg">Categorising ingredients...</div>
        <div id="error-message" class="error-msg" style="display:none;"></div>

        <div id="categories-container"></div>

        <div id="additions-section" class="ingredient-category" style="display:none;">
            <h2 class="category-title">Added by You</h2>
            <div class="chip-row" id="additions-chip-row"></div>
        </div>

        <div class="add-ingredient-row" id="add-row" style="display:none;">
            <input type="text" class="add-ingredient-input" id="global-add-input" placeholder="Add a missing ingredient...">
            <button class="add-ingredient-btn" onclick="addIngredient()">+ Add</button>
        </div>

        <div class="ingredients-actions" id="ingredients-actions" style="display:none;">
            <button class="btn-secondary" onclick="retake()">↩ Retake Photo</button>
            <button class="btn-primary" onclick="confirmIngredients()">Find Recipes →</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/home" class="nav-item">
            <div class="nav-icon">⌂</div>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item upload-item">
            <div class="nav-icon">+</div>
            <span>Upload</span>
        </a>
        <a href="/favourites" class="nav-item">
            <div class="nav-icon">♡</div>
            <span>Saved</span>
        </a>
        <a href="/account" class="nav-item">
            <div class="nav-icon">👤</div>
            <span>Account</span>
        </a>
    </nav>

    <script src="/static/js/ingredients.js"></script>
</body>
</html>
