<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipix — Favourites</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="top-nav">
        <div class="nav-logo">Recipix</div>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/favourites" class="active">Saved</a>
            <a href="/account">Account</a>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </nav>

    <div class="page-content">
        <h1 class="page-title">Saved Recipes</h1>

        <div id="loading" class="loading-msg">Loading your favourites...</div>
        <div id="error-message" class="error-msg" style="display:none;"></div>

        <div class="results-grid" id="favourites-grid"></div>

        <div id="no-favourites" class="no-results-state" style="display:none;">
            <p class="no-results-text">No saved recipes yet. Find a recipe you like and tap the heart!</p>
            <button class="btn-primary" onclick="window.location.href='/home'">Start cooking</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/home" class="nav-item">
            <div class="nav-icon">⌂</div>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item upload-item">
            <div class="nav-icon">+</div>
            <span>Upload</span>
        </a>
        <a href="/favourites" class="nav-item active">
            <div class="nav-icon">♡</div>
            <span>Saved</span>
        </a>
        <a href="/account" class="nav-item">
            <div class="nav-icon">👤</div>
            <span>Account</span>
        </a>
    </nav>

    <script src="/static/js/favourites.js"></script>
</body>
</html>
