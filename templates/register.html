<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipix — Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Recipix</h1>
        <h2>Find recipes from what you have</h2>

        <div id="error-message" class="error-msg" style="display:none;"></div>
        <div id="success-message" class="success-msg" style="display:none;"></div>

        <div class="auth-form">
            <input type="email" id="email" placeholder="Email address">
            <input type="password" id="password" placeholder="Password (8+ characters)">
            <button onclick="register()">Create Account</button>
        </div>

        <div class="auth-divider"></div>
        <p>Already have an account? <a href="/login">Log in</a></p>
    </div>
    <script src="/static/js/auth.js"></script> 
</body>
</html>
